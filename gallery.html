<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Mothotsi Security Steel</title>
  <meta name="description" content="Gallery of Mothotsi Security Steel projects." />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; background: #f7fbff; color: #0f172a; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; }
    a.button { display: inline-block; padding: 10px 14px; background: #0b5ed7; color: white; text-decoration: none; border-radius: 8px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .tile { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 6px 18px rgba(11, 94, 215, 0.08); }
    .tile img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gallery</h1>
      <a class="button" href="index.html">Back</a>
    </header>

    <p>Explore some of our recent steel and gate installation work.</p>

    <div class="gallery" id="galleryContainer">
      <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px 0;" id="loadingMessage">
        <h3>Loading gallery images...</h3>
      </div>
    </div>
  </div>

  <script>
    // Configuration for backend URL (can point to local or cloudflare worker)
    const BACKEND_URL = 'https://shrill-disk-8aac.tshiamomichael4.workers.dev'; // Leave blank if on same host, or define standard backend endpoint if hosting static files elsewhere

    // Escape helper
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function loadGallery() {
      const container = document.getElementById('galleryContainer');
      const loadingMessage = document.getElementById('loadingMessage');

      try {
        const res = await fetch(`${BACKEND_URL}/api/images`);
        if (!res.ok) {
          throw new Error('Failed to load images from API');
        }

        const images = await res.json();

        if (images.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px 0;">
              <h3>No images have been uploaded to the gallery yet.</h3>
              <p>Check back later or contact admin to upload project pictures!</p>
            </div>`;
          return;
        }

        // Clear loading message
        container.innerHTML = '';

        for (const img of images) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.innerHTML = `
            <img id="gallery-img-${img.id}" src="" alt="${escapeHtml(img.title)}" />
            <p>${escapeHtml(img.title)}</p>
          `;
          container.appendChild(tile);

          // Fetch the raw base64 data to set as source
          try {
            const imgRes = await fetch(`${BACKEND_URL}/image/${img.id}`);
            if (imgRes.ok) {
              const base64Str = await imgRes.text();
              const imgEl = document.getElementById(`gallery-img-${img.id}`);
              if (imgEl) {
                imgEl.src = base64Str;
              }
            }
          } catch (e) {
            console.error("Error loading image content for id: " + img.id, e);
          }
        }

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #ef4444; padding: 40px 0;">
            <h3>Failed to load gallery images.</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
      }
    }

    // Load gallery on page load
    window.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
</html>
