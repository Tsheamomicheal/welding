<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Mothotsi Security Steel</title>
  <meta name="description" content="Gallery of Mothotsi Security Steel projects." />
  <style>
    :root {
      --primary: #b45309;      /* Professional Amber/Gold */
      --primary-hover: #92400e;
      --secondary: #475569;    /* Slate Gray */
      --accent: #fef3c7;       /* Soft Gold Accent Tint */
      --background: #f8fafc;   /* Premium ultra-light slate */
      --text: #1e293b;         /* Charcoal Dark Slate */
      --text-muted: #64748b;   /* Muted Slate Gray */
      --deep: #0f172a;         /* Deep Slate Dark */
      --border: #e2e8f0;       /* Soft borders */
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px 0;
      background-color: var(--background);
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    h1 {
      color: var(--deep);
      margin: 0;
      font-size: 2rem;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    a.button:hover {
      background-color: var(--primary-hover);
    }

    .intro-text {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .tile {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .tile img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #f1f5f9;
    }

    .tile p {
      margin: 12px 0 4px;
      font-weight: 600;
      color: var(--deep);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gallery</h1>
      <a class="button" href="index.html">Back Home</a>
    </header>

    <p class="intro-text">Explore some of our recent steel and gate installation work.</p>

    <div class="gallery" id="galleryContainer">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0;" id="loadingMessage">
        <h3>Loading gallery images...</h3>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://shrill-disk-8aac.tshiamomichael4.workers.dev';

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function loadGallery() {
      const container = document.getElementById('galleryContainer');
      const loadingMessage = document.getElementById('loadingMessage');

      try {
        const res = await fetch(`${BACKEND_URL}/api/images`);
        if (!res.ok) {
          throw new Error('Failed to load images from API');
        }

        const images = await res.json();

        if (images.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0;">
              <h3>No images have been uploaded to the gallery yet.</h3>
              <p>Check back later or contact admin to upload project pictures!</p>
            </div>`;
          return;
        }

        container.innerHTML = '';

        for (const img of images) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.innerHTML = `
            <img id="gallery-img-${img.id}" src="" alt="${escapeHtml(img.title)}" />
            <p>${escapeHtml(img.title)}</p>
          `;
          container.appendChild(tile);

          try {
            const imgRes = await fetch(`${BACKEND_URL}/image/${img.id}`);
            if (imgRes.ok) {
              const base64Str = await imgRes.text();
              const imgEl = document.getElementById(`gallery-img-${img.id}`);
              if (imgEl) {
                imgEl.src = base64Str;
              }
            }
          } catch (e) {
            console.error("Error loading image content for id: " + img.id, e);
          }
        }

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #ef4444; padding: 40px 0;">
            <h3>Failed to load gallery images.</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
</html>
